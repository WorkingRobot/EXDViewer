[package]
name = "web"
description = "Backend web server for EXDViewer"
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[features]
trunk_assets = []

[dependencies]
xiv-dl-cache = { version = "*", features = ["prometheus"] }
xiv-dl-core = "*"
pathlist = { path = "../pathlist" }
shadow-rs = { version = "2", default-features = false }
actix-cors = "0.7"
actix-web = "4"
actix-web-lab = "0.26"
actix-web-prom = { version = "0.10", features = ["process"] }
actix-web-helmet = "1"
actix-files = "0.6"
async-channel = "2"
bytes = "1"
anyhow = "1"
config = { version = "0.15", default-features = false, features = ["yaml"] }
csv = "1"
dotenvy = "0.15"
flate2 = "1"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fs_extra = "1"
mini-moka = "0.10"
hex = { version = "0.4", features = ["serde"] }
itertools = "0.15"
ironworks = { version = "0.4", features = ["sqpack"] }
konst = "0.4"
log = "0.4"
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"
regex-lite = "0.1"

# console-subscriber = "0.4"

[build-dependencies]
shadow-rs = "2"

[target.'cfg(target_os = "linux")'.build-dependencies]
procfs = "0.18"
